[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "engine"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.19.0"
ndk = "0.7.0"
ndk-context = "0.1.1"
ndk-sys = "0.4.0"

[dependencies]
c_string = "0.7.2"
ash = "0.37.3"
libloading = "0.8"
cgmath = "0.18.0"
collision = { version = "0.20.1", git = "https://github.com/rustgd/collision-rs" }
fbxcel-dom = "0.0.10"
image = "0.24.3"
lazy_static = "1.4.0"
once_cell = "1.17.0"
pcx = "0.2.3"
rand = "0.8.5"
rodio = { git = "https://github.com/RustAudio/rodio", version = "0.17.1", features=["symphonia-all"], default-features=false }
texture2ddecoder = "0.1.2"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

[dev-dependencies]
glfw = { version = "0.56.0", features = ["vulkan"] }

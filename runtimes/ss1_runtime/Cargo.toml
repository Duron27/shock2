[package]
name = "ss1_runtime"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "System Shock (1994) on the shock2quest engine"

[dependencies]
# Only the MIT engine and the SS1 crates: no System Shock 2 code.
engine = { path = "../../engine" }
ss1 = { path = "../../ss1" }
glfw = { version = "0.56.0", features = ["vulkan"] }
cgmath = "0.18.0"
clap = { version = "4.5.4", features = ["derive"] }
image = { version = "0.24.5", default-features = false, features = ["png"] }
anyhow = "1.0"
tracing-subscriber = "0.3.16"

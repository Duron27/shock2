[package]
name = "shock2vr"
version = "0.0.1"
edition = "2024"

[lints]
workspace = true

[lib]
name = "shock2vr"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pcx = "0.2.3"
bitflags = "1.3.2"
cgmath = { version = "0.18.0", features = ["serde"] }
collision = { version = "0.20.1", git = "https://github.com/rustgd/collision-rs" }
engine = { path = "../engine" }
engine_ffmpeg = { path = "../engine_ffmpeg", optional = true }
num-derive = "0.3.3"
num-traits = "0.2.15"
once_cell = "1.17.0"
ordered-float = "3.4.0"
pathfinding = "4"
rapier3d = { version = "0.31", features = ["debug-render"] }
serde_json = "1.0.91"
shipyard = "0.6.2"
dark = { path = "../dark" }
tracing = "0.1.37"
serde = "1.0.164"
rand = "0.8.5"

# zip's C-backed methods (bzip2, zstd) don't build for the Xbox 360, whose .kpf archives are deflate or stored.
[target.'cfg(not(target_os = "xbox360"))'.dependencies]
zip = "0.6.6"

[target.'cfg(target_os = "xbox360")'.dependencies]
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[features]
default = ["ffmpeg"]
ffmpeg = ["engine_ffmpeg"]

# Opt-in aggregate timings; normal builds have no instrumentation overhead.
physics-profiling = ["rapier3d/profiler"]

# Shadow-query prototype; leaves gameplay collision and melee paths unchanged.
damage-query-audit = []

# Experimental query-only creature damage volumes; preserves the legacy default.
lazy-hitboxes = []

[dev-dependencies]
flate2 = "1.1"

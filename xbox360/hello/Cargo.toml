[package]
name = "xenon_hello"
version = "0.1.0"
edition = "2024"
description = "A no_std Rust test title for the Xbox 360 on xsdk: clears the screen, reads a controller, rumbles"

[lib]
# Linked by xsdk's GCC, not by rustc: see xbox360/build.sh.
crate-type = ["staticlib"]
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
debug = true

# Not part of the game's workspace: it builds only for the custom target.
[workspace]
